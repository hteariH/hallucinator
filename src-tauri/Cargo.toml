[package]
name = "llm-calc"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "sync", "fs", "io-util", "macros", "rt-multi-thread", "net"] }
tokio-util = "0.7"
reqwest = { version = "0.13", features = ["stream", "json"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Security", "Win32_System_JobObjects"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
strip = true
