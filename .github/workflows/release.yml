name: Release

# git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: npm ci
      - run: npm test
      - run: npm run build
      # Run the script in pwsh directly: Windows PowerShell started from pwsh inherits
      # pwsh's module path and loses Get-FileHash.
      - run: pwsh -NoProfile -File scripts/fetch-llama.ps1
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build

      - name: Check installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe
          if (-not $exe) { throw "installer not built" }
          "INSTALLER=$($exe.FullName)" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: llm-calc-windows
          path: ${{ env.INSTALLER }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME "$env:INSTALLER" --title $env:GITHUB_REF_NAME --generate-notes
